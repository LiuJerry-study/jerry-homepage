<script>
  /* 主题要在首次绘制前定下来，否则会闪一下白。逻辑由构建脚本注入，和长页面完全一致。 */
  (function () {
    var t = 'light';
    var MODE = 'random';          /* 后台「主题」里设的默认：random | system | light | dark */
    try {
      var q = new URLSearchParams(location.search).get('theme');
      var saved = null, picked = null;
      try { saved = localStorage.getItem('portal-theme'); } catch (e) { /* 隐私模式 */ }
      try { picked = sessionStorage.getItem('portal-theme-session'); } catch (e) { /* 隐私模式 */ }

      if (q === 'light' || q === 'dark') {
        t = q;
      } else if (saved === 'light' || saved === 'dark') {
        t = saved;
      } else if (picked === 'light' || picked === 'dark') {
        t = picked;
      } else if (MODE === 'light' || MODE === 'dark') {
        t = MODE;
      } else if (MODE === 'random') {
        t = Math.random() < 0.5 ? 'light' : 'dark';
        try { sessionStorage.setItem('portal-theme-session', t); } catch (e) { /* 忽略 */ }
      } else if (matchMedia('(prefers-color-scheme: dark)').matches) {
        t = 'dark';
      }
    } catch (e) { /* 老浏览器：用默认浅色 */ }
    document.documentElement.dataset.theme = t;
    /* 地址栏配色跟着主题走（<meta name="theme-color"> 就在上面，这里能直接改到） */
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'dark' ? '#07130F' : '#F4F9F5');
  })();
</script>
