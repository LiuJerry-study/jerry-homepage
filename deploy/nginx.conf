# ==========================================================================
# nginx 站点配置（个人门户 · 动态站）
# --------------------------------------------------------------------------
# 页面由本机的渲染进程按需生成（deploy/personal-site-site.service，监听 8080），
# nginx 干两件事：把页面反代过去、把静态资源自己发掉。
#
# 为什么不干脆全反代：/assets/ 下是几个不会再变的大文件（styles.css / main.js），
# 让 nginx 直接发磁盘就走不到 Node 那一步 —— 首屏最重的恰好是它们。
#
# 安装：
#     sudo cp deploy/nginx.conf /etc/nginx/sites-available/personal-site
#     sudo ln -s /etc/nginx/sites-available/personal-site /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
# 配 HTTPS：
#     sudo apt install certbot python3-certbot-nginx
#     sudo certbot --nginx -d xixid.cloud -d www.xixid.cloud
# certbot 会自动改这个文件（加 443 段和跳转），不用手写证书路径。
# ==========================================================================

upstream personal_site_app {
    server 127.0.0.1:8080;
    keepalive 16;                 # 复用连接，别每个请求都重开一条
}

server {
    listen 80;
    listen [::]:80;
    server_name xixid.cloud www.xixid.cloud;

    # ← 要和 deploy/deploy.env 里的 DEPLOY_PATH 一致
    root /var/www/personal-site;  # 只用来发 /assets 和 /proto，页面不走磁盘
    charset utf-8;

    # ---------------- ① 静态资源：不经过 Node ----------------

    # 图片直接从 content/images/ 发 —— 后台刚传的图不用等下一次构建
    location ^~ /assets/images/ {
        alias /var/www/personal-site/content/images/;   # ← 同上，跟着 DEPLOY_PATH 走
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ⚠ 两个例外：这两个 .js 是**渲染进程按内容现生成**的，不是构建产物 ——
    #   site-data.js  卡片角标里的 {{posts}}、开关、主标语、卡片列表
    #   site-index.js 命令面板的搜索索引
    # 它们跟着 content/ 变。要是也从磁盘发（下面那条 1 年 immutable），
    # 后台新发的文章就永远搜不到、角标数字也永远不涨。所以精确匹配先接走它们。
    # nginx 的匹配顺序是 = 精确 > ^~ 前缀 > 正则，所以这两条要写在 /assets/ 前面。
    location = /assets/site-data.js  { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
    location = /assets/site-index.js { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }

    # 其余 /assets/ 下的东西全部带着 ?v= 版本串，可以放心长期缓存
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 交互实验页（proto/ 下的左右对照），不参与站点导航
    location ^~ /proto/ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---------------- ② 写作后台（可选；不用就整段删掉）----------------

    # 后台跑在本机 8787（deploy/personal-site-admin.service），
    # 只有这三个前缀转给它，其余请求不受影响。
    # 想再加一层保险，把下面那行 allow/deny 的注释打开，只允许你自己的 IP 进后台。

    location = /admin { return 301 /admin/; }
    location /admin/ {
        # allow 203.0.113.7; deny all;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4m;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4m;
    }
    location /preview/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
    }

    # 渲染进程的本地管理口本来就在 8081（nginx 不代理它）。
    # 这里再挡一道：万一哪天端口配错了，外网也够不着。
    location ^~ /__ { return 404; }

    # ---------------- ③ 页面：反代给渲染进程 ----------------

    location / {
        proxy_pass http://personal_site_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";      # 配合 upstream 的 keepalive
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # 渲染一次约 25ms，给 10 秒余量；真卡住了也别把 nginx 的 worker 占满
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # 渲染进程挂了/重启中的时候，别给访客一个 nginx 的默认白页
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        default_type 'text/plain; charset=utf-8';
        return 503 "站点正在重启，刷新一下试试。\n";
    }

    # ---------------- ④ 杂物 ----------------

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # gzip：静态站最划算的一项。
    # gzip_proxied 必须开 —— 默认是 off，反代过来的 HTML 会被漏掉，
    # 而 HTML 恰好是这里唯一没被 nginx 直接发的东西。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/xml
        application/rss+xml
        application/javascript
        application/json
        image/svg+xml;

    # 别让 .git / 隐藏文件被访问到（就算不小心传上去了）
    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/personal-site.access.log;
    error_log  /var/log/nginx/personal-site.error.log;
}
