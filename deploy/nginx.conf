# ==========================================================================
# nginx 站点配置（个人门户 · 静态站）
# --------------------------------------------------------------------------
# 放到 /etc/nginx/sites-available/personal-site，然后：
#     sudo ln -s /etc/nginx/sites-available/personal-site /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
# 配 HTTPS：
#     sudo apt install certbot python3-certbot-nginx
#     sudo certbot --nginx -d example.com -d www.example.com
# certbot 会自动改这个文件（加 443 段和跳转），不用手写证书路径。
# ==========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;   # ← 改成你的域名；没有域名就用服务器 IP

    root /var/www/personal-site;               # ← 要和 deploy/deploy.env 里的 DEPLOY_PATH 一致
    index index.html;

    charset utf-8;

    # 找不到就交给 404.html（状态码仍然是 404，不会被当成软 404）
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML 不缓存：内容更新后访客立刻拿到新的
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # CSS / JS 走 ?v=版本串，可以放心长期缓存
    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 图片、字体：一周
    location ~* \.(png|jpe?g|gif|webp|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 给 RSS / sitemap 一个正确的类型（nginx 默认的 mime.types 偶尔会漏 xml 的 charset）
    location ~* \.(xml|txt)$ {
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
    }

    # 顺手加的几个安全头（静态站用不上多少，但没坏处）
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # gzip：静态站点最划算的一项
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/xml
        application/rss+xml
        application/javascript
        application/json
        image/svg+xml;

    # 别让 .git / 隐藏文件被访问到（就算不小心传上去了）
    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/personal-site.access.log;
    error_log  /var/log/nginx/personal-site.error.log;
}
